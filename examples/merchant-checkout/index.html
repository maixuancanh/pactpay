<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merchant checkout integration · PactPay</title><style>body{font:16px system-ui;margin:40px auto;max-width:780px;padding:0 20px;color:#17352c}label{display:block;margin:18px 0}input{display:block;width:100%;padding:10px;box-sizing:border-box}button{padding:12px 18px}iframe{width:100%;height:680px;border:1px solid #ddd;margin-top:20px}pre{white-space:pre-wrap}</style><h1>Merchant checkout example</h1><p>Have your server create a short-lived checkout session bound to your exact origin, locked quote and chain. Paste only its public session ID and nonce below. Merchant API secrets stay on your server.</p><form id="checkout"><label>PactPay origin<input id="origin" type="url" value="http://127.0.0.1:5173" required></label><label>Public checkout session ID<input id="session" required></label><label>Session nonce<input id="nonce" required></label><button>Open secure checkout</button></form><p id="status" role="status"></p><div id="frame"></div><script type="module">
let checkoutWindow,expected;document.querySelector('#checkout').addEventListener('submit',event=>{event.preventDefault();const origin=new URL(document.querySelector('#origin').value).origin;expected={origin,sessionId:document.querySelector('#session').value,nonce:document.querySelector('#nonce').value};const iframe=document.createElement('iframe');iframe.title='PactPay checkout';iframe.src=origin+'/embed?session='+encodeURIComponent(expected.sessionId);iframe.allow='publickey-credentials-get';document.querySelector('#frame').replaceChildren(iframe);checkoutWindow=iframe.contentWindow;document.querySelector('#status').textContent='Checkout opened. Awaiting a progress notice.';});window.addEventListener('message',event=>{const d=event.data;if(!expected||event.origin!==expected.origin||event.source!==checkoutWindow||!d||typeof d!=='object'||Object.keys(d).sort().join(',')!=='nonce,sessionId,status,type,version'||d.type!=='pactpay.checkout'||d.version!==1||d.nonce!==expected.nonce||d.sessionId!==expected.sessionId||!['pending','confirmed','failed'].includes(d.status))return;document.querySelector('#status').textContent='Browser notice: '+d.status+'. Verify your signed webhook and finalized chain evidence before fulfilling this booking.';});
</script></html>
